name: auto-commit
permissions:
  contents: write

on:
  schedule:
    - cron: "0 */8 * * *" #every 8 hours
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
           fetch-depth: 0         # get full history
           persist-credentials: true
      - run: |
          echo "$(date)" >> log.txt
          git config user.name MalakaSenanayake
          git config user.email contact.malaka.senanayake@gmail.com
          git add log.txt
          git commit -m "daily update: $(date)" || echo "no changes"
          git push
